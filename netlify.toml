# Netlify build configuration.
# This repo is a monorepo (frontend/, backend/, analytics/ as siblings),
# so Netlify needs to be told to build only the frontend subfolder.

[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

# All redirect rules (API proxy + SPA fallback) live in frontend/public/_redirects
# instead of here, since that file needs editing with your actual backend URL
# before each deploy, and keeping redirects in one place avoids rule conflicts.
