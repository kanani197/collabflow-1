version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: collabflow-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: collabflow
      POSTGRES_PASSWORD: collabflow_dev_password
      POSTGRES_DB: collabflow
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/1-schema.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/2-seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U collabflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: collabflow-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 5000
      DATABASE_URL: postgres://collabflow:collabflow_dev_password@postgres:5432/collabflow
      JWT_SECRET: change_me_in_production
      PYTHON_ANALYTICS_PATH: /app/analytics
      UPLOAD_DIRECTORY: /app/data/uploads
      DEFAULT_DATASET_PATH: /app/data/default/dissertation_dataset.xlsx
    volumes:
      - ./data:/app/data
    ports:
      - "5000:5000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: collabflow-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  pgdata:
